# Gateway API with Cilium: one Gateway, one HTTPRoute that routes /api to api and / to web.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shop-gw
  namespace: shop
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces: { from: Same }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shop-route
  namespace: shop
spec:
  parentRefs: [{ name: shop-gw }]
  rules:
    - matches: [{ path: { type: PathPrefix, value: /api } }]
      backendRefs: [{ name: api, port: 80 }]
    - matches: [{ path: { type: PathPrefix, value: / } }]
      backendRefs: [{ name: web, port: 80 }]
---
# The Gateway (Envoy inside Cilium) must be allowed to reach web and api once default-deny is on.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-from-ingress
  namespace: shop
spec:
  endpointSelector:
    matchExpressions:
      - { key: app, operator: In, values: [web, api] }
  ingress:
    - fromEntities: [ingress]
      toPorts: [{ ports: [{ port: "8080", protocol: TCP }] }]
