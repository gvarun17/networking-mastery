# kind cluster with no default CNI and no kube-proxy, so Cilium provides both.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: netlab
networking:
  disableDefaultCNI: true
  kubeProxyMode: none
  podSubnet: 10.244.0.0/16
  serviceSubnet: 10.96.0.0/16
nodes:
  - role: control-plane
  - role: worker
  - role: worker
