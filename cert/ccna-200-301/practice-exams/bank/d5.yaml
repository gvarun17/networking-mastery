# Domain 5.0 AI, and Network Operations and Management (hand-written).
- q: "What best describes agentic AI in network operations?"
  o: ["A static script that runs one show command", "An AI system that plans multi-step tasks and calls tools (show commands, telemetry queries, ticket APIs) to reach a goal", "A replacement for routing protocols", "A new YANG model"]
  a: B
  e: "Agents reason and act through tools; guardrails and approvals keep them safe."
- q: "Which TWO practices make an AI agent safer in a production network?"
  o: ["Least-privilege, read-only tool access by default", "Human approval before configuration changes, with audit logs", "Giving the agent enable-level access to all devices", "Disabling logging to save storage", "Allowing the agent to change its own permissions"]
  a: "A,B"
  e: "Restrict tools, require approvals for changes, log everything."
- q: "You want a public generative AI tool to explain an ACL change. The config includes SNMP communities and local user hashes. What should you do first?"
  o: ["Paste the full config for best context", "Remove or mask sensitive data according to its classification, or use an approved enterprise tool", "Ask the AI to keep it secret", "Encode the config in Base64"]
  a: B
  e: "Data classification decides what may be shared with which AI tool."
- q: "Which prompt is best for getting a usable review of a routing change from a generative AI assistant?"
  o: ["'Is this OK?'", "'You are a senior network engineer. Review this OSPF change for risks. Do not invent commands. Answer as a table: line, risk, fix.'", "'Write me a poem about OSPF.'", "'Fix my network.'"]
  a: B
  e: "Good prompts set a persona, give clear instructions and define the output format."
- q: "Which management approach configures each device individually through its own CLI?"
  o: ["Controller-based", "Device-based (traditional)", "Cloud-based", "Infrastructure as code"]
  a: B
  e: "Traditional management is per device, usually SSH."
- q: "In a controller-based architecture, what is the southbound interface?"
  o: ["The REST API used by scripts to talk to the controller", "The interface/protocols the controller uses to program network devices (e.g. NETCONF, RESTCONF, SSH)", "The console port", "The management VLAN"]
  a: B
  e: "Northbound = apps to controller; southbound = controller to devices."
- q: "Which statement describes cloud-based network management (for example Meraki)?"
  o: ["Devices are managed from a cloud dashboard while user traffic stays local", "All user traffic must traverse the cloud", "It needs no internet connection", "It requires OSPF to the cloud"]
  a: A
  e: "The management plane is in the cloud; the data plane stays on site."
- q: "What is infrastructure as code for networks?"
  o: ["Typing commands faster", "Declaring desired network state in version-controlled files that a pipeline validates and applies", "Using only GUI tools", "Storing configs on USB drives"]
  a: B
  e: "Git, templates, CI checks and automated deployment."
- q: "What is the main function of SNMP in network operations?"
  o: ["Encrypting user traffic", "Monitoring and (optionally) managing devices by reading/writing MIB objects and receiving traps", "Routing between areas", "Assigning IP addresses"]
  a: B
  e: "Managers poll agents (UDP 161); agents send traps/informs (UDP 162)."
- q: "Which SNMP version supports authentication and encryption?"
  o: ["v1", "v2c", "v3", "All versions"]
  a: C
  e: "SNMPv3 authPriv uses e.g. SHA and AES."
- q: "What is the difference between an SNMP trap and an inform?"
  o: ["Traps are acknowledged; informs are not", "Informs are acknowledged by the manager; traps are not", "Traps use TCP", "There is no difference"]
  a: B
  e: "Informs are retransmitted until acknowledged, so they are more reliable."
- q: "In SNMP, what is a MIB?"
  o: ["A transport protocol", "A hierarchical database of manageable objects addressed by OIDs", "A type of trap", "An encryption key"]
  a: B
  e: "For example IF-MIB ifHCInOctets = 1.3.6.1.2.1.31.1.1.1.6."
- q: "Which Ansible characteristic is true?"
  o: ["It needs an agent on every network device", "It is agentless and connects over SSH or APIs from a control node", "It only works on Windows", "It requires a database server"]
  a: B
  e: "Network modules use network_cli, netconf or httpapi connections."
- q: "Which Ansible file lists the devices to manage and their variables?"
  o: ["Playbook", "Inventory", "Role", "ansible.cfg only"]
  a: B
  e: "Playbooks define tasks; inventories define hosts and groups."
- q: "Which TWO statements describe idempotent Ansible tasks?"
  o: ["Running the playbook again makes no changes if the device already matches", "The task result reports `changed=0` on a second run", "They always reboot the device", "They cannot be run in check mode", "They require manual approval each time"]
  a: "A,B"
  e: "Resource modules compare desired and current state."
- q: "Which Ansible option shows what would change without applying it?"
  o: ["--check (with --diff)", "--force", "--verbose only", "--limit"]
  a: A
  e: "Check mode is a dry run; --diff prints the differences."
- q: "Which module would you use to run `show version` on Cisco IOS devices with Ansible?"
  o: ["cisco.ios.ios_command", "ansible.builtin.copy", "cisco.ios.ios_vlans", "community.general.ping"]
  a: A
  e: "ios_command runs operational commands; resource modules (ios_vlans, ios_interfaces) manage config."
- q: "In the message `*Mar 3 10:41:07: %LINEPROTO-5-UPDOWN: Line protocol on Interface Gi0/1, changed state to down`, what is LINEPROTO?"
  o: ["Severity", "Facility", "Mnemonic", "Hostname"]
  a: B
  e: "Format: %FACILITY-SEVERITY-MNEMONIC."
- q: "Why should every device have NTP configured before you rely on syslog?"
  o: ["NTP encrypts logs", "Accurate, consistent timestamps let you correlate events across devices", "Syslog requires NTP to start", "NTP increases buffer size"]
  a: B
  e: "Also enable `service timestamps log datetime msec`."
- q: "Which command sends syslog messages of severity warning and more severe to server 10.99.0.14?"
  o: ["logging host 10.99.0.14 and logging trap warnings", "logging buffered 4", "logging console 10.99.0.14", "snmp-server host 10.99.0.14 warnings"]
  a: A
  e: "`logging trap` sets the level sent to remote hosts."
- q: "Which syslog severity is more critical: level 2 or level 6?"
  o: ["Level 6", "Level 2", "They are equal", "It depends on the facility"]
  a: B
  e: "Lower numbers are more severe (2 critical, 6 informational)."
- q: "Which approach describes a network managed by an automation tool that pushes the same template to many devices?"
  o: ["Automation-based management", "Device-based management", "Out-of-band console only", "Manual change control"]
  a: A
  e: "Automation tools (Ansible, Python, Nornir) apply consistent changes at scale."
- q: "A team stores intended switch configs in Git and deploys them with a CI pipeline after peer review. Which TWO benefits does this give?"
  o: ["Change history and easy rollback", "Automated validation before deployment", "No need for testing", "No need for access control", "Faster console access"]
  a: "A,B"
  e: "Version control and CI make changes reviewable, testable and reversible."
