global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["host.docker.internal:9100"]
    # On Linux, if host.docker.internal does not resolve, use the docker0 gateway IP (often 172.17.0.1).

  - job_name: goflow2
    static_configs:
      - targets: ["goflow2:8080"]

  - job_name: blackbox-icmp
    metrics_path: /probe
    params: { module: [icmp] }
    static_configs:
      - targets: ["1.1.1.1", "8.8.8.8", "ec2.ap-south-1.amazonaws.com"]
    relabel_configs:
      - { source_labels: [__address__], target_label: __param_target }
      - { source_labels: [__param_target], target_label: instance }
      - { target_label: __address__, replacement: "blackbox:9115" }

  - job_name: blackbox-http
    metrics_path: /probe
    params: { module: [http_2xx] }
    static_configs:
      - targets: ["https://www.cloudflare.com", "https://aws.amazon.com"]
    relabel_configs:
      - { source_labels: [__address__], target_label: __param_target }
      - { source_labels: [__param_target], target_label: instance }
      - { target_label: __address__, replacement: "blackbox:9115" }

  - job_name: blackbox-dns
    metrics_path: /probe
    params: { module: [dns_a] }
    static_configs:
      - targets: ["1.1.1.1", "8.8.8.8"]
    relabel_configs:
      - { source_labels: [__address__], target_label: __param_target }
      - { source_labels: [__param_target], target_label: instance }
      - { target_label: __address__, replacement: "blackbox:9115" }
