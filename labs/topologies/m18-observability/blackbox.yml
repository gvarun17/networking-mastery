modules:
  icmp:
    prober: icmp
    timeout: 5s
    icmp:
      preferred_ip_protocol: ip4
  http_2xx:
    prober: http
    timeout: 10s
    http:
      valid_status_codes: []        # defaults to 2xx
      preferred_ip_protocol: ip4
      follow_redirects: true
  dns_a:
    prober: dns
    timeout: 5s
    dns:
      query_name: aws.amazon.com
      query_type: A
      preferred_ip_protocol: ip4
