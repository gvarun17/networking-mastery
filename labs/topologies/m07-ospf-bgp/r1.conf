frr defaults traditional
hostname r1
!
interface lo
 ip address 1.1.1.1/32
 ip address 198.51.100.1/32
 ip ospf area 0
!
interface eth1
 ip address 10.0.12.1/30
 ip ospf area 0
 ip ospf network point-to-point
!
interface eth2
 ip address 203.0.113.1/30
!
! Anchor route so the BGP network statement has an exact match
ip route 198.51.100.0/24 Null0
!
ip prefix-list OUT seq 10 permit 198.51.100.0/24
ip prefix-list IN seq 10 permit 0.0.0.0/0
ip prefix-list IN seq 20 permit 8.8.8.0/24
!
router ospf
 ospf router-id 1.1.1.1
 auto-cost reference-bandwidth 100000
 passive-interface lo
 default-information originate
!
router bgp 65001
 bgp router-id 1.1.1.1
 no bgp ebgp-requires-policy
 neighbor 203.0.113.2 remote-as 65002
 neighbor 203.0.113.2 description ISP
 !
 address-family ipv4 unicast
  network 198.51.100.0/24
  neighbor 203.0.113.2 prefix-list IN in
  neighbor 203.0.113.2 prefix-list OUT out
 exit-address-family
!
line vty
!
