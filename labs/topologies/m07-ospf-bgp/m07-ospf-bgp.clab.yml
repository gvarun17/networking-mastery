# Module 07 lab: multi-area OSPF (area 0 + area 1) and eBGP to an ISP.
# Deploy: sudo containerlab deploy -t m07-ospf-bgp.clab.yml
name: m07-ospf-bgp

topology:
  defaults:
    kind: linux
    image: quay.io/frrouting/frr:10.2.1
    exec:
      - sysctl -w net.ipv4.ip_forward=1
  nodes:
    r1:
      binds: [../common/daemons:/etc/frr/daemons, r1.conf:/etc/frr/frr.conf]
    r2:
      binds: [../common/daemons:/etc/frr/daemons, r2.conf:/etc/frr/frr.conf]
    r3:
      binds: [../common/daemons:/etc/frr/daemons, r3.conf:/etc/frr/frr.conf]
    isp:
      binds: [../common/daemons:/etc/frr/daemons, isp.conf:/etc/frr/frr.conf]
    h3:
      image: nicolaka/netshoot:latest
      exec:
        - ip addr add 10.3.0.10/24 dev eth1
        - ip route replace default via 10.3.0.1
  links:
    - endpoints: ["r1:eth1", "r2:eth1"]    # 10.0.12.0/30 area 0
    - endpoints: ["r2:eth2", "r3:eth1"]    # 10.0.23.0/30 area 1
    - endpoints: ["r1:eth2", "isp:eth1"]   # 203.0.113.0/30 eBGP
    - endpoints: ["r3:eth2", "h3:eth1"]    # 10.3.0.0/24 LAN
