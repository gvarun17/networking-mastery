frr defaults traditional
hostname r1
!
interface eth1
 ip address 10.1.0.1/24
!
interface eth2
 ip address 10.0.12.1/30
!
interface eth3
 ip address 10.0.13.1/30
!
! Primary path to the 10.3.0.0/24 LAN through r2
ip route 10.3.0.0/24 10.0.12.2
! Floating static: backup path through the direct link, AD 200
ip route 10.3.0.0/24 10.0.13.2 200
! Lab task: add a more specific /25 route in step 4
!
line vty
!
