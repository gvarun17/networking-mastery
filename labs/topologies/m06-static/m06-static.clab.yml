# Module 06 lab: static routes, longest prefix match and floating static failover.
# Deploy: sudo containerlab deploy -t m06-static.clab.yml
name: m06-static

topology:
  defaults:
    kind: linux
    image: quay.io/frrouting/frr:10.2.1
    exec:
      - sysctl -w net.ipv4.ip_forward=1
  nodes:
    r1:
      binds: [../common/daemons:/etc/frr/daemons, r1.conf:/etc/frr/frr.conf]
    r2:
      binds: [../common/daemons:/etc/frr/daemons, r2.conf:/etc/frr/frr.conf]
    r3:
      binds: [../common/daemons:/etc/frr/daemons, r3.conf:/etc/frr/frr.conf]
    h1:
      image: nicolaka/netshoot:latest
      exec:
        - ip addr add 10.1.0.10/24 dev eth1
        - ip route replace default via 10.1.0.1
    h3:
      image: nicolaka/netshoot:latest
      exec:
        - ip addr add 10.3.0.10/24 dev eth1
        - ip addr add 10.3.0.200/24 dev eth1
        - ip route replace default via 10.3.0.1
  links:
    - endpoints: ["h1:eth1", "r1:eth1"]
    - endpoints: ["r1:eth2", "r2:eth1"]   # 10.0.12.0/30 primary path
    - endpoints: ["r2:eth2", "r3:eth2"]   # 10.0.23.0/30
    - endpoints: ["r1:eth3", "r3:eth3"]   # 10.0.13.0/30 backup path
    - endpoints: ["r3:eth1", "h3:eth1"]
