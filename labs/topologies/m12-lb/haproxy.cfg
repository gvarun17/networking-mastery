global
    log stdout format raw local0
    maxconn 2000

defaults
    log     global
    timeout connect 3s
    timeout client  30s
    timeout server  30s

# ---------- L4: TCP round robin, no HTTP awareness ----------
frontend fe_l4
    mode tcp
    bind :8081
    default_backend be_l4

backend be_l4
    mode tcp
    balance roundrobin
    server web1 web1:8000 check
    server web2 web2:8000 check

# ---------- L7: HTTP path routing + X-Forwarded-For ----------
frontend fe_l7
    mode http
    bind :8080
    bind :8443 ssl crt /certs/lab.pem alpn h2,http/1.1
    option forwardfor
    http-response set-header X-LB l7-haproxy
    acl is_api path_beg /api
    use_backend be_api if is_api
    default_backend be_web

backend be_web
    mode http
    balance roundrobin
    option httpchk GET /healthz
    server web1 web1:8000 check
    server web2 web2:8000 check

backend be_api
    mode http
    option httpchk GET /healthz
    server api1 api1:8000 check

# ---------- Stats ----------
frontend stats
    mode http
    bind :8404
    stats enable
    stats uri /
    stats refresh 5s
