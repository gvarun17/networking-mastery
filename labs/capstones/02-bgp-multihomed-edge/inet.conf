frr defaults traditional
hostname inet
!
interface lo
 ip address 8.8.8.8/32
!
interface eth1
 ip address 100.64.11.2/30
!
interface eth2
 ip address 100.64.12.2/30
!
ip route 8.8.8.0/24 Null0
! A bogon "leak" that a well-filtered customer must reject
ip route 10.0.0.0/8 Null0
!
router bgp 64999
 bgp router-id 9.9.9.9
 no bgp ebgp-requires-policy
 neighbor 100.64.11.1 remote-as 64501
 neighbor 100.64.12.1 remote-as 64502
 !
 address-family ipv4 unicast
  network 8.8.8.0/24
  network 10.0.0.0/8
 exit-address-family
!
line vty
!
