frr defaults traditional
hostname ce1
!
interface eth1
 description ISP1 (primary)
 ip address 100.64.1.2/30
!
interface eth2
 description ISP2 (backup)
 ip address 100.64.2.2/30
!
interface eth3
 description LAN
 ip address 198.51.100.1/24
!
router bgp 65010
 bgp router-id 198.51.100.1
 no bgp ebgp-requires-policy
 neighbor 100.64.1.1 remote-as 64501
 neighbor 100.64.2.1 remote-as 64502
 !
 address-family ipv4 unicast
  network 198.51.100.0/24
 exit-address-family
!
! TODO (capstone): add inbound and outbound policy, local preference, AS-path prepending,
! maximum-prefix and BFD. See README requirements R1-R7.
!
line vty
!
