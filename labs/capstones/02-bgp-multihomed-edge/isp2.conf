frr defaults traditional
hostname isp2
!
interface eth1
 description to-customer-ce1
 ip address 100.64.2.1/30
!
interface eth2
 description to-internet
 ip address 100.64.12.1/30
!
! The ISP's own customer prefix
ip route 203.0.113.0/24 Null0
!
router bgp 64502
 bgp router-id 2.2.2.2
 no bgp ebgp-requires-policy
 neighbor 100.64.2.2 remote-as 65010
 neighbor 100.64.2.2 description CUSTOMER-ACME
 neighbor 100.64.2.2 bfd
 neighbor 100.64.12.2 remote-as 64999
 neighbor 100.64.12.2 description INTERNET
 !
 address-family ipv4 unicast
  network 203.0.113.0/24
  neighbor 100.64.2.2 default-originate
 exit-address-family
!
line vty
!
