frr defaults traditional
hostname isp1
!
interface eth1
 description to-customer-ce1
 ip address 100.64.1.1/30
!
interface eth2
 description to-internet
 ip address 100.64.11.1/30
!
! The ISP's own customer prefix
ip route 192.0.2.0/24 Null0
!
router bgp 64501
 bgp router-id 1.1.1.1
 no bgp ebgp-requires-policy
 neighbor 100.64.1.2 remote-as 65010
 neighbor 100.64.1.2 description CUSTOMER-ACME
 neighbor 100.64.1.2 bfd
 neighbor 100.64.11.2 remote-as 64999
 neighbor 100.64.11.2 description INTERNET
 !
 address-family ipv4 unicast
  network 192.0.2.0/24
  neighbor 100.64.1.2 default-originate
 exit-address-family
!
line vty
!
