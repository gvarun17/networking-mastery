frr defaults traditional
hostname ce1
!
interface eth1
 description ISP1 (primary)
 ip address 100.64.1.2/30
!
interface eth2
 description ISP2 (backup)
 ip address 100.64.2.2/30
!
interface eth3
 description LAN
 ip address 198.51.100.1/24
!
! R1: advertise only our own prefix (no transit)
ip prefix-list OWN seq 10 permit 198.51.100.0/24
!
! R2: accept default and public prefixes up to /24; drop bogons and our own prefix
ip prefix-list FROM-ISP seq 5 deny 198.51.100.0/24 le 32
ip prefix-list FROM-ISP seq 10 deny 10.0.0.0/8 le 32
ip prefix-list FROM-ISP seq 20 deny 172.16.0.0/12 le 32
ip prefix-list FROM-ISP seq 30 deny 192.168.0.0/16 le 32
ip prefix-list FROM-ISP seq 40 deny 100.64.0.0/10 le 32
ip prefix-list FROM-ISP seq 50 deny 127.0.0.0/8 le 32
ip prefix-list FROM-ISP seq 100 permit 0.0.0.0/0 le 24
!
! R3: ISP1 preferred for outbound traffic
route-map ISP1-IN permit 10
 match ip address prefix-list FROM-ISP
 set local-preference 200
!
route-map ISP2-IN permit 10
 match ip address prefix-list FROM-ISP
 set local-preference 100
!
route-map ISP1-OUT permit 10
 match ip address prefix-list OWN
!
! R4: make inbound traffic prefer ISP1 by prepending toward ISP2
route-map ISP2-OUT permit 10
 match ip address prefix-list OWN
 set as-path prepend 65010 65010 65010
!
router bgp 65010
 bgp router-id 198.51.100.1
 neighbor 100.64.1.1 remote-as 64501
 neighbor 100.64.1.1 description ISP1
 neighbor 100.64.1.1 bfd
 neighbor 100.64.2.1 remote-as 64502
 neighbor 100.64.2.1 description ISP2
 neighbor 100.64.2.1 bfd
 !
 address-family ipv4 unicast
  network 198.51.100.0/24
  neighbor 100.64.1.1 route-map ISP1-IN in
  neighbor 100.64.1.1 route-map ISP1-OUT out
  neighbor 100.64.1.1 maximum-prefix 100
  neighbor 100.64.2.1 route-map ISP2-IN in
  neighbor 100.64.2.1 route-map ISP2-OUT out
  neighbor 100.64.2.1 maximum-prefix 100
 exit-address-family
!
line vty
!
