# Capstone 2: customer edge (AS 65010) dual-homed to ISP1 (AS 64501) and ISP2 (AS 64502).
# Deploy: sudo containerlab deploy -t capstone2.clab.yml
# To test the reference solution, change the ce1 bind to solution/ce1.conf.
name: cap2

topology:
  defaults:
    kind: linux
    image: quay.io/frrouting/frr:10.2.1
    exec:
      - sysctl -w net.ipv4.ip_forward=1
  nodes:
    ce1:
      binds: [../../topologies/common/daemons:/etc/frr/daemons, ce1.conf:/etc/frr/frr.conf]
    isp1:
      binds: [../../topologies/common/daemons:/etc/frr/daemons, isp1.conf:/etc/frr/frr.conf]
    isp2:
      binds: [../../topologies/common/daemons:/etc/frr/daemons, isp2.conf:/etc/frr/frr.conf]
    inet:
      binds: [../../topologies/common/daemons:/etc/frr/daemons, inet.conf:/etc/frr/frr.conf]
    h1:
      image: nicolaka/netshoot:latest
      exec:
        - ip addr add 198.51.100.10/24 dev eth1
        - ip route replace default via 198.51.100.1
  links:
    - endpoints: ["ce1:eth1", "isp1:eth1"]    # 100.64.1.0/30
    - endpoints: ["ce1:eth2", "isp2:eth1"]    # 100.64.2.0/30
    - endpoints: ["isp1:eth2", "inet:eth1"]   # 100.64.11.0/30
    - endpoints: ["isp2:eth2", "inet:eth2"]   # 100.64.12.0/30
    - endpoints: ["ce1:eth3", "h1:eth1"]      # 198.51.100.0/24
