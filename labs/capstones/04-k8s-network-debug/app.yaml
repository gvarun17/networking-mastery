# "shop": frontend (curl loop) -> backend:80 (http-echo on 8080). A toolbox pod for debugging.
apiVersion: v1
kind: Namespace
metadata:
  name: shop
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: backend, namespace: shop }
spec:
  replicas: 2
  selector: { matchLabels: { app: backend } }
  template:
    metadata: { labels: { app: backend } }
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0
          args: ["-listen=:8080", "-text=backend ok"]
          ports: [{ containerPort: 8080, name: http }]
          readinessProbe:
            httpGet: { path: /, port: 8080 }
---
apiVersion: v1
kind: Service
metadata: { name: backend, namespace: shop }
spec:
  selector: { app: backend }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend, namespace: shop }
spec:
  replicas: 1
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
        - name: loop
          image: curlimages/curl:8.10.1
          command: ["sh", "-c", "while true; do date; curl -s -m 3 http://backend/ || echo BACKEND-FAIL; curl -s -m 3 -o /dev/null -w 'external %{http_code}\\n' https://kubernetes.io || echo EXTERNAL-FAIL; sleep 5; done"]
---
apiVersion: v1
kind: Pod
metadata: { name: toolbox, namespace: shop, labels: { app: toolbox } }
spec:
  containers:
    - name: netshoot
      image: nicolaka/netshoot:latest
      command: ["sleep", "infinity"]
